# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
# Crates must be usable in an Apache-2.0 OR MIT project. Vendor binding crates
# with other terms get explicit exceptions here when they arrive (plan, section 4).
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "ISC", "Zlib", "BSD-3-Clause"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# zbus_names, zvariant and zvariant_derive were merged into zbus 6; the
# notify-rust release we use (Linux desktop notifications) still depends on
# zbus 5. Unmaintained notices, not vulnerabilities. Remove once notify-rust
# moves to zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "unmaintained zbus 5 sub-crate via notify-rust; merged into zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained zbus 5 sub-crate via notify-rust; merged into zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained zbus 5 sub-crate via notify-rust; merged into zbus 6" },
]
