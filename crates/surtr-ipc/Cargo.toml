[package]
name = "surtr-ipc"
description = "Local IPC between surtr serve and its front ends (owner-only socket or pipe)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "macros"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "sync", "time"] }

[lints]
workspace = true
