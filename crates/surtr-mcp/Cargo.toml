[package]
name = "surtr-mcp"
description = "MCP server for Surtr: read-only hardware tools for AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
surtr-api.workspace = true
surtr-stress.workspace = true
surtr-core.workspace = true
surtr-model.workspace = true
surtr-view.workspace = true
serde_json.workspace = true
serde.workspace = true
schemars = "1"
rmcp = { version = "3.6", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
tracing = "0.1"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tokio-util = "0.7"

[dev-dependencies]
surtr-backend = { workspace = true, features = ["mock"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[lints]
workspace = true
