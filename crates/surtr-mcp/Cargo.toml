[package]
name = "surtr-mcp"
description = "MCP server for Surtr: read-only hardware tools for AI agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
surtr-model.workspace = true
surtr-core.workspace = true
surtr-store.workspace = true
surtr-view.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3.6", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
surtr-backend = { workspace = true, features = ["mock"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[lints]
workspace = true
