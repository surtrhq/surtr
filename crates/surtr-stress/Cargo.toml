[package]
name = "surtr-stress"
description = "Built-in stress tests for Surtr: verified workloads run in worker processes under host-enforced limits"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
surtr-model.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_System_SystemInformation"] }

[lints]
workspace = true
