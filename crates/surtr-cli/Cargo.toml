[package]
name = "surtr-cli"
description = "The surtr command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "surtr"
path = "src/main.rs"

[dependencies]
surtr-model.workspace = true
surtr-backend = { workspace = true, features = ["mock"] }
surtr-backend-native.workspace = true
surtr-backend-amd.workspace = true
surtr-backend-nvidia.workspace = true
surtr-core.workspace = true
surtr-export.workspace = true
surtr-ipc.workspace = true
surtr-mcp.workspace = true
surtr-api.workspace = true
surtr-stress.workspace = true
ctrlc = "3"
surtr-store.workspace = true
surtr-tui.workspace = true
surtr-view.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
anstream = "1.0.0"
anstyle = "1.0.14"
clap_complete = "4.6.11"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1.1.10"
crossterm = "0.29"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "sync", "macros", "time"] }
notify-rust = "4"

[lints]
workspace = true

[dev-dependencies]
insta = "1.49.0"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
