[package]
name = "surtr-cli"
description = "The surtr command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "surtr"
path = "src/main.rs"

[dependencies]
surtr-model.workspace = true
surtr-backend = { workspace = true, features = ["mock"] }
surtr-backend-native.workspace = true
surtr-backend-amd.workspace = true
surtr-backend-nvidia.workspace = true
surtr-core.workspace = true
surtr-store.workspace = true
surtr-view.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
anstream = "1.0.0"
anstyle = "1.0.14"
clap_complete = "4.6.11"

[lints]
workspace = true

[dev-dependencies]
insta = "1.49.0"
