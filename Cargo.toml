[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/surtrhq/surtr"
publish = false

[workspace.dependencies]
surtr-model = { path = "crates/surtr-model" }
surtr-backend = { path = "crates/surtr-backend" }
surtr-backend-native = { path = "crates/surtr-backend-native" }
surtr-backend-nvidia = { path = "crates/surtr-backend-nvidia" }
surtr-backend-amd = { path = "crates/surtr-backend-amd" }
surtr-core = { path = "crates/surtr-core" }
surtr-ipc = { path = "crates/surtr-ipc" }
surtr-export = { path = "crates/surtr-export" }
surtr-store = { path = "crates/surtr-store" }
surtr-view = { path = "crates/surtr-view" }
surtr-tui = { path = "crates/surtr-tui" }
surtr-mcp = { path = "crates/surtr-mcp" }
surtr-api = { path = "crates/surtr-api" }
surtr-stress = { path = "crates/surtr-stress" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
