[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/surtrhq/surtr"
publish = false

[workspace.dependencies]
surtr-model = { path = "crates/surtr-model" }
surtr-backend = { path = "crates/surtr-backend" }
surtr-backend-native = { path = "crates/surtr-backend-native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
